<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Under Pressure</title>
<meta name="description" content="Digitale playtestversie van de fysieke editie van Planet Under Pressure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<header id="top">
  <div class="brand"><span class="b1">PLANET</span> <span class="b2">UNDER PRESSURE</span></div>
  <div id="status"></div>
  <nav>
    <button id="btnRules" class="ghost" title="Spiekbrief"><i data-lucide="book-open"></i><span>Spiekbrief</span></button>
    <button id="btnGM" class="ghost" title="Spelleider-modus: blokjes en sporen handmatig corrigeren"><i data-lucide="pencil"></i><span>Spelleider</span></button>
    <button id="btnNew" class="ghost" title="Nieuw spel"><i data-lucide="rotate-ccw"></i><span>Nieuw spel</span></button>
  </nav>
</header>

<main id="app">
  <section id="left">
    <div id="pickBar" hidden></div>
    <div id="boardWrap">
      <div id="board">
        <img id="mapImg" src="assets/board/map.webp" alt="Speelbord: wereldkaart met 28 steden in 5 systeemzones" draggable="false">
        <div id="overlay"></div>
      </div>
    </div>
    <div id="band"></div>
  </section>
  <aside id="side">
    <div id="turnPanel"></div>
    <div id="players"></div>
    <div id="logWrap"><div class="h">Logboek</div><ol id="log"></ol></div>
  </aside>
</main>

<div id="modal" class="modal" hidden></div>
<div id="zoom" class="zoom" hidden></div>
<div id="toast" hidden></div>
<div id="setup" class="setup" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" integrity="sha384-ieG+IKD0d/ZPXyCBTMVAbqsQdns8QGJR/e26WMw7M4fkaI/rHcS/YIoi+ah9WGge" crossorigin="anonymous"></script>
<script src="js/data.gen.js?v=2"></script>
<script src="js/data.js?v=2"></script>
<script src="js/game.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
</body>
</html>
